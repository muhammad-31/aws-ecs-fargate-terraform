name: CI

# Runs on every pull request and on main. Needs no cloud credentials:
# Terraform tests use a mocked AWS provider and the image is only built locally.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.16.5"
  TFLINT_VERSION: "v0.64.0"

jobs:
  terraform:
    name: Terraform fmt / validate / test / lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive -diff

      - name: Validate root configurations
        run: |
          for dir in bootstrap environments/dev environments/prod; do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      - name: Unit tests (mocked AWS provider)
        run: |
          status=0
          for dir in modules/network modules/alb stacks/web-app; do
            echo "::group::test $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            if ! terraform -chdir="$dir" test -no-color > test.log 2>&1; then
              status=1
              # Surface the failure as an annotation on the PR / commit.
              msg="$(tail -n 60 test.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN{ORS="%0A"} {print}')"
              echo "::error title=terraform test failed in ${dir}::${msg}"
            fi
            cat test.log
            echo "::endgroup::"
          done
          exit "$status"

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: TFLint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

  checkov:
    name: Checkov (IaC security)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan Terraform
        uses: bridgecrewio/checkov-action@6f26dc90000b74feb589a906cdfae540f5119895 # v12.3134.0
        with:
          directory: .
          framework: terraform,github_actions,dockerfile
          quiet: true
          output_format: cli,sarif
          output_file_path: console,checkov.sarif

      - name: Upload results to code scanning
        if: always() && github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: checkov.sarif
          category: checkov

  app:
    name: App tests / Dockerfile lint / image scan
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Unit tests
        run: |
          pip install -r requirements-dev.txt
          python -m pytest

      - name: Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: app/Dockerfile

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          load: true
          push: false
          tags: webapp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image (fixable high/critical CVEs fail the build)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: webapp:ci
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
